name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4

      - name: Pick an available ${{ matrix.device }} simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          prefix = sys.argv[1]
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith(prefix)))
          ' "${{ matrix.device }}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: xcodebuild test -scheme FontManager -destination "id=${{ steps.simulator.outputs.udid }}"
